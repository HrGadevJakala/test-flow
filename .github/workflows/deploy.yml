name: Deploy on Tag

on:
  push:
    tags:
      - 'dev-*'
      - 'rel-*'

permissions:
  contents: write

env:
  HUSKY: 0
  TAG_NAME: ${{ github.ref_name }}

jobs:
  deploy-to-acquia:
    name: Deploy to Acquia
    runs-on: ubuntu-latest
    steps:
      - name: Debug environment
        run: |
          echo "Triggered by tag: ${{ github.ref_name }}"
          echo "Full ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Workspace: $GITHUB_WORKSPACE"
