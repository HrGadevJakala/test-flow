name: CGIAR CICD

on:
  push:
    branches: [ "develop", "stage" ]
  pull_request:
    branches: [ "develop", "stage" ]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write

env:
  HUSKY: 0
  TAG_NAME: ${{ github.ref_name }}

jobs:
  build:
    name: Build BE & FE
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debugs
        run: |
          echo "Head ref: ${{ github.event.pull_request.head.ref }}"
          echo "Base ref: ${{ github.event.pull_request.base.ref }}"
          echo "head: ${{ github.head_ref }}"
          echo "base: ${{ github.base_ref }}"
          echo "action: ${{ github.event.action }}"

  create-tag:
    name: Auto-create tag from merged branch
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.push_tag.outputs.tag }}
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'develop' || github.event.pull_request.base.ref == 'stage')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Extract source and target branch info
        id: branch
        run: |
          src_branch="${{ github.head_ref }}"   # e.g. feature/TEST-12344
          target_branch="${{ github.base_ref }}" # e.g. develop or stage
  
          echo "Source branch: $src_branch"
          echo "Target branch: $target_branch"
  
          ticket_id=$(echo "$src_branch" | sed -E 's#.*/##')  # Extract TEST-12344
          ticket_num=$(echo "$ticket_id" | grep -oE '[0-9]+$') # Extract 12344
  
          echo "ticket_id=$ticket_id" >> $GITHUB_OUTPUT
          echo "ticket_num=$ticket_num" >> $GITHUB_OUTPUT
          echo "target_branch=$target_branch" >> $GITHUB_OUTPUT

      - name: Set prefix based on target branch
        id: prefix
        run: |
          if [[ "${{ github.base_ref }}" == "develop" ]]; then
            echo "prefix=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.base_ref }}" == "stage" ]]; then
            echo "prefix=rel" >> $GITHUB_OUTPUT
          else
            echo "❌ Unsupported target branch: ${{ github.base_ref }}"
            exit 1
          fi

      - name: Determine next available environment-wide ID
        id: next_env_id
        run: |
          prefix="${{ steps.prefix.outputs.prefix }}"
  
          # Get existing tags for this environment, e.g. dev-*, rel-*
          existing_tags=$(git tag -l "${prefix}-*")
          if [ -z "$existing_tags" ]; then
            next_env_num=1
          else
            # Extract the middle number part: dev-<num>-<branchnum>
            max_num=$(echo "$existing_tags" | grep -oE "${prefix}-[0-9]+" | grep -oE '[0-9]+' | sort -n | tail -1)
            next_env_num=$((max_num + 1))
          fi
  
          echo "next_env_num=$next_env_num" >> $GITHUB_OUTPUT
          echo "Next environment ID: $next_env_num"

      - name: Build new tag name
        id: new_tag
        run: |
          prefix="${{ steps.prefix.outputs.prefix }}"
          env_num="${{ steps.next_env_id.outputs.next_env_num }}"
          branch_num="${{ steps.branch.outputs.ticket_num }}"
  
          new_tag="${prefix}-${env_num}-${branch_num}"
  
          echo "✅ New tag will be: $new_tag"
          echo "tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Create and push new tag
        id: push_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag ${{ steps.new_tag.outputs.tag }}
          git push origin ${{ steps.new_tag.outputs.tag }}
          echo "tag=${{ steps.new_tag.outputs.tag }}" >> $GITHUB_OUTPUT

  deploy-to-acquia:
    name: Deploy to Acquia with tag
    runs-on: ubuntu-latest
    needs: create-tag
    if: needs.create-tag.outputs.tag != ''
    steps:
      - name: Debug - Print environment and workspace
        run: |
          echo "Deploying tag: ${{ needs.create-tag.outputs.tag }}"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "Workspace=$GITHUB_WORKSPACE"
