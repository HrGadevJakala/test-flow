name: CGIAR CICD

on:
  push:
    branches: [ "develop" ]
    tags: [ '[0-9]+\.[0-9]+\.[0-9]+' ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: write

env:
  HUSKY: 0
  TAG_NAME: ${{ github.ref_name }}

jobs:
  build:
    name: Build BE & FE
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  create-tag:
    name: Auto-create tag from merged branch
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/stage'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Print full GitHub event JSON
        run: |
          echo "---- GITHUB EVENT START ----"
          cat "$GITHUB_EVENT_PATH"
          echo "---- GITHUB EVENT END ----"

      - name: Extract source and target branch info
        id: branch
        run: |
          src_branch="${{ github.head_ref }}"   # e.g. feature/TEST-12344
          target_branch="${{ github.base_ref }}" # e.g. develop or stage
          echo "Source branch: $src_branch"
          echo "Target branch: $target_branch"
          
          ticket_id=$(echo "$src_branch" | sed -E 's#.*/##')  # Extract TEST-12344
          echo "ticket_id=$ticket_id" >> $GITHUB_OUTPUT
          echo "target_branch=$target_branch" >> $GITHUB_OUTPUT

      - name: Set prefix based on target branch
        id: prefix
        run: |
          if [[ "${{ steps.branch.outputs.target_branch }}" == "develop" ]]; then
            echo "prefix=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.branch.outputs.target_branch }}" == "stage" ]]; then
            echo "prefix=stage" >> $GITHUB_OUTPUT
          else
            echo "❌ Unsupported target branch: ${{ steps.branch.outputs.target_branch }}"
            exit 1
          fi

      - name: Determine next available tag
        id: next_tag
        run: |
          base_tag="${{ steps.prefix.outputs.prefix }}-${{ steps.branch.outputs.ticket_id }}"
          echo "Base tag: $base_tag"
          
          existing_tags=$(git tag -l "${base_tag}*")
          if [ -z "$existing_tags" ]; then
            new_tag="$base_tag"
          else
            count=$(echo "$existing_tags" | grep -E "^${base_tag}(-[0-9]+)?$" | wc -l | tr -d ' ')
            next_num=$((count + 1))
            new_tag="${base_tag}-${next_num}"
          fi
          
          echo "✅ New tag will be: $new_tag"
          echo "tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Create and push new tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag ${{ steps.next_tag.outputs.tag }}
          git push origin ${{ steps.next_tag.outputs.tag }}

  deploy-to-acquia:
    name: Deploy to Acquia with tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Debug - Print environment and workspace
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "Workspace=$GITHUB_WORKSPACE"
          env
